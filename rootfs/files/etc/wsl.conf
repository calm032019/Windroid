# Windroid distro WSL config.
# [boot] command:
# - the /mnt/shared_memory tmpfs MUST be mounted before WSLg's compositor
#   starts or Waydroid windows render black with [WARN:COPY MODE] titles
#   (ddcash fix — docs/UPSTREAM-FACTS.md §6);
# - mount --make-rshared /: WSL boots with private root propagation (native
#   systemd hosts are rshared). Without this, mounts made after container
#   start never reach Android's internal storage namespaces and the
#   Downloads share is invisible to apps (spike finding, 2026-08-30).
[boot]
systemd = true
command = mkdir -p /mnt/shared_memory && mount -t tmpfs tmpfs /mnt/shared_memory && mount --make-rshared /

[user]
default = windroid
