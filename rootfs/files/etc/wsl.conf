# Windroid distro WSL config.
# [boot] command: the /mnt/shared_memory tmpfs MUST be mounted before WSLg's
# compositor starts or Waydroid windows render black with [WARN:COPY MODE]
# titles (ddcash fix — docs/UPSTREAM-FACTS.md §6).
[boot]
systemd = true
command = mkdir -p /mnt/shared_memory && mount -t tmpfs tmpfs /mnt/shared_memory

[user]
default = windroid
