# Windroid guest-side configuration, read by windroid-firstboot and
# windroid-session. Shell syntax (sourced). The installer may rewrite these
# values before first boot.

# GAPPS=true: ignore the preseeded VANILLA images and run
# `waydroid init -s GAPPS` (downloads on this machine — GApps images are
# never redistributed, ADR-004).
GAPPS=false

# FORCE_SOFTWARE_RENDERING=true: pin SwiftShader via the supported
# [properties] override in waydroid.cfg instead of Waydroid's auto-detect
# (spike question Q2; auto-detect may misfire on WSL's /dev/dxg).
FORCE_SOFTWARE_RENDERING=true

# MULTI_WINDOWS=true: per-app desktop windows (spike question Q1).
# false = single full-UI window.
MULTI_WINDOWS=true

# NESTED_WESTON=true: run the session inside a nested Weston instead of
# talking to WSLg's compositor directly (prior-art fallback for the stuck
# 1x1-buffer bug; defeats per-app windows, so default off until Q1 says
# otherwise).
NESTED_WESTON=false

# Windows->Android file sharing (plan Phase 2.5): bind-mount this Windows
# Downloads dir (as seen from WSL, e.g. /mnt/c/Users/<name>/Downloads) into
# Android's shared storage at session start, per the documented mechanism
# (mount --bind into ~/.local/share/waydroid/data/media/0/Download).
# Empty = disabled. The installer fills this in.
WINDOWS_DOWNLOADS=""
