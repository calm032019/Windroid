# .wsl distro-file metadata (WSL >= 2.4.4; ignored by plain wsl --import).
# Keys per learn.microsoft.com/en-us/windows/wsl/build-custom-distro
# (docs/UPSTREAM-FACTS.md §3). File must be root:root 0644 in the tar.
[oobe]
defaultUid = 1000
defaultName = Windroid

[shortcut]
enabled = true
icon = /usr/lib/windroid/windroid.ico

[windowsterminal]
enabled = false
